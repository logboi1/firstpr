project_id = "firstpr"

# The handler validates every user JWT with Supabase Auth before service RPCs.
# The legacy gateway JWT check does not support rotated asymmetric signing keys.
[functions.sync-github-merges]
verify_jwt = false

[api]
enabled = true
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
major_version = 17

[db.seed]
enabled = false
sql_paths = ["./seed.sql"]
